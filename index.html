<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Note Studio</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="max-w-md mx-auto p-4 space-y-4">
  <div class="flex items-center justify-between border-b border-slate-700 pb-3">
    <h1 class="text-xl font-bold text-white flex items-center gap-2">
      <span class="text-2xl">📝</span> QuickNote
    </h1>
    <span id="saveStatus" class="text-xs text-emerald-400 bg-emerald-950/60 border border-emerald-800 px-2.5 py-1 rounded-full">
      <i class="fa-solid fa-check mr-1"></i> Ready
    </span>
  </div>

  <textarea id="noteInput" placeholder="Start typing your notes here..." class="w-full h-64 bg-slate-800/80 border border-slate-700 rounded-xl p-3 text-sm text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500 resize-none"></textarea>

  <div class="flex items-center justify-between text-xs text-slate-400">
    <span id="charCount">0 characters</span>
    <button onclick="clearNotes()" class="bg-rose-900/40 border border-rose-800/50 hover:bg-rose-900 text-rose-300 px-3 py-1.5 rounded-lg transition">
      Clear Notes
    </button>
  </div>
</div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('SW Registered!', reg))
          .catch(err => console.error('SW Register Failed!', err));
      });
    }
  </script>
</body>
</html>
